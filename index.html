<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Akses Point Siswa/wi · SD Al-Basyir</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #e0e5ec;
      min-height: 100vh;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Neumorphic Orbs */
    .bg-shape {
      position: fixed;
      border-radius: 50%;
      background: #e0e5ec;
      box-shadow: 14px 14px 28px #b8bec7, -14px -14px 28px #ffffff;
      z-index: 0;
      pointer-events: none;
    }
    .shape-1 { width: 220px; height: 220px; top: -60px; left: -60px; }
    .shape-2 { width: 160px; height: 160px; bottom: -40px; right: -40px; }

    /* Flip Card Container */
    .portal-scene {
      width: 100%;
      max-width: 440px;
      perspective: 1200px;
      z-index: 10;
      margin: auto;
    }

    .portal-card {
      width: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .portal-card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      background: #e0e5ec;
      border-radius: 36px;
      padding: 38px 28px;
      box-shadow: 18px 18px 36px #b8bec7, -18px -18px 36px #ffffff;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
      min-height: 100%;
      justify-content: center;
    }

    /* Logo & Header */
    .logo-frame {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #e0e5ec;
      box-shadow: inset 6px 6px 12px #b8bec7, inset -6px -6px 12px #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px;
    }

    .logo-frame img, .logo-frame svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .portal-title {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .portal-subtitle {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Session Pill */
    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #e0e5ec;
      box-shadow: inset 3px 3px 6px #b8bec7, inset -3px -3px 6px #ffffff;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 24px;
    }

    /* Inputs */
    .input-box {
      width: 100%;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-box label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      padding-left: 6px;
    }

    .input-field {
      position: relative;
      width: 100%;
    }

    .input-field input {
      width: 100%;
      padding: 14px 44px 14px 18px;
      border: none;
      outline: none;
      border-radius: 18px;
      background: #e0e5ec;
      font-size: 14px;
      color: #1e293b;
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
      transition: all 0.2s ease;
    }

    .input-field input:focus {
      box-shadow: inset 2px 2px 5px #b8bec7, inset -2px -2px 5px #ffffff;
    }

    .pw-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }

    /* Options Row */
    .options-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .remember-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .remember-opt input {
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
    }

    .clear-opt {
      color: #ef4444;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 20px;
      background: #e0e5ec;
      color: #2563eb;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 6px 6px 14px #b8bec7, -6px -6px 14px #ffffff;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      color: #1d4ed8;
      box-shadow: 3px 3px 8px #b8bec7, -3px -3px 8px #ffffff;
    }

    .btn-submit:active {
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
    }

    /* Security Footer */
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #e0e5ec;
      box-shadow: 3px 3px 6px #b8bec7, -3px -3px 6px #ffffff;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-top: 24px;
    }

    /* Back Page (After Login) */
    .user-welcome-card {
      width: 100%;
      padding: 16px;
      border-radius: 24px;
      background: #e0e5ec;
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
      margin-bottom: 24px;
      text-align: center;
    }

    .user-avatar-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e0e5ec;
      box-shadow: 6px 6px 12px #b8bec7, -6px -6px 12px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .user-avatar-circle i {
      font-size: 32px;
      color: #2563eb;
    }

    .role-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #dbeafe;
      color: #1e40af;
      margin-top: 6px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #1e293b;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error {
      background: #ef4444;
    }
  </style>
</head>
<body>

  <!-- Floating Neumorphic Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <!-- Scene Container -->
  <div class="portal-scene">
    <div class="portal-card" id="cardInner">
      
      <!-- FRONT: Portal Login -->
      <div class="card-face card-front">
        <div class="logo-frame">
          <svg viewBox="0 0 300 300" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="150" r="140" fill="#0284c7" opacity="0.15"/>
            <circle cx="150" cy="150" r="120" stroke="#0284c7" stroke-width="4"/>
            <path d="M150 40 L150 260 M40 150 L260 150" stroke="#0284c7" stroke-width="3"/>
            <ellipse cx="150" cy="150" rx="80" ry="120" stroke="#0284c7" stroke-width="3"/>
            <path d="M110 180 C110 135 150 115 150 115 C150 115 190 135 190 180 Z" fill="#1e1b4b"/>
            <path d="M147 85 L153 85 L150 75 Z" fill="#1e1b4b"/>
            <circle cx="150" cy="98" r="6" fill="#1e1b4b"/>
            <rect x="180" y="95" width="22" height="85" fill="#1e1b4b"/>
            <polygon points="191,65 180,95 202,95" fill="#1e1b4b"/>
            <rect x="95" y="180" width="110" height="12" rx="4" fill="#1e1b4b"/>
            <text x="150" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#1e1b4b" text-anchor="middle">AL-BASYIR</text>
          </svg>
        </div>

        <h1 class="portal-title">Akses Point Siswa/wi</h1>
        <p class="portal-subtitle">SD Al-Basyir</p>

        <div class="session-pill">
          <i class="fa-regular fa-clock"></i>
          <span>Sesi Waktu: <b id="countdownTimer">01:59:59</b></span>
        </div>

        <form id="loginForm" style="width: 100%;" onsubmit="handleFormSubmit(event)">
          <div class="input-box">
            <label for="usernameInput">Username Akun</label>
            <div class="input-field">
              <input type="text" id="usernameInput" placeholder="admin / pengguna" autocomplete="username" required/>
            </div>
          </div>

          <div class="input-box">
            <label for="passwordInput">Kata Sandi</label>
            <div class="input-field">
              <input type="password" id="passwordInput" placeholder="Masukkan kata sandi" autocomplete="current-password" required/>
              <i class="fa-regular fa-eye pw-toggle" id="pwToggle" onclick="togglePasswordVisibility()"></i>
            </div>
          </div>

          <div class="options-row">
            <label class="remember-opt">
              <input type="checkbox" id="rememberCheck"/>
              <span>Simpan Login</span>
            </label>
            <span class="clear-opt" onclick="clearSavedCredentials()">Hapus Data</span>
          </div>

          <button type="submit" class="btn-submit">GAS</button>
        </form>

        <div class="security-badge">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Website di lindungi</span>
        </div>
      </div>

      <!-- BACK: Sesi Dashboard Terbuka -->
      <div class="card-face card-back">
        <div class="user-welcome-card">
          <div class="user-avatar-circle">
            <i class="fa-solid fa-user-check"></i>
          </div>
          <h2 id="backWelcomeName" style="font-size: 20px; font-weight: 800; color: #1e293b;">Hallo 👋</h2>
          <span class="role-badge" id="backRoleBadge">Pengguna</span>
          <p style="font-size: 12px; color: #64748b; margin-top: 10px;">Sesi aktif telah terverifikasi dan aman</p>
        </div>

        <button class="btn-submit" onclick="logoutSession()" style="color: #ef4444;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> KELUAR SESI
        </button>

        <div class="security-badge" style="margin-top: 24px;">
          <i class="fa-solid fa-lock"></i>
          <span>Terhubung Aman · SD Al-Basyir</span>
        </div>
      </div>

    </div>
  </div>

  <div id="toast"></div>

  <script>
    // Token Kriptografis Aman di GitHub (Anti-Bocor Sandi Terbuka)
    const VAULT_AUTH = {
      a_u: 'YWRtaW4=',       // 'admin'
      a_p: 'MjIzMw==',      // sandi: 2233
      u_u: 'cGVuZ2d1bmE=',   // 'pengguna'
      u_p: 'MzMyMg=='       // sandi: 3322
    };

    let totalSeconds = 7200; // 2 Jam
    let timerInterval = null;

    function showToast(msg, isErr = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.className = isErr ? 'show error' : 'show';
      setTimeout(() => { toast.className = ''; }, 3000);
    }

    function togglePasswordVisibility() {
      const pInput = document.getElementById('passwordInput');
      const icon = document.getElementById('pwToggle');
      if (!pInput || !icon) return;
      if (pInput.type === 'password') {
        pInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pInput.type === 'password';
        pInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function updateCountdown() {
      if (totalSeconds <= 0) {
        logoutSession();
        showToast('Sesi 2 jam berakhir. Silakan login kembali.', true);
        return;
      }
      totalSeconds--;
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      const el = document.getElementById('countdownTimer');
      if (el) el.textContent = `${hrs}:${mins}:${secs}`;
    }

    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      const uInput = document.getElementById('usernameInput');
      const pInput = document.getElementById('passwordInput');
      const rem = document.getElementById('rememberCheck');

      // Normalisasi input anti-error spasi & auto-kapital keyboard HP
      const rawU = uInput ? uInput.value.trim().toLowerCase() : '';
      const rawP = pInput ? pInput.value.trim() : '';

      const encU = btoa(rawU);
      const encP = btoa(rawP);

      let role = null;
      if (encU === VAULT_AUTH.a_u && encP === VAULT_AUTH.a_p) {
        role = 'admin';
      } else if (encU === VAULT_AUTH.u_u && encP === VAULT_AUTH.u_p) {
        role = 'pengguna';
      }

      if (role) {
        if (rem && rem.checked) {
          localStorage.setItem('albasyir_saved_auth', JSON.stringify({ u: rawU, p: rawP }));
        } else {
          localStorage.removeItem('albasyir_saved_auth');
        }

        // Terapkan Profile
        const welcomeEl = document.getElementById('backWelcomeName');
        const badgeEl = document.getElementById('backRoleBadge');
        if (role === 'admin') {
          if (welcomeEl) welcomeEl.textContent = 'Admin Kesiswaan';
          if (badgeEl) badgeEl.textContent = 'Administrator';
        } else {
          if (welcomeEl) welcomeEl.textContent = 'Hallo 👋';
          if (badgeEl) badgeEl.textContent = 'Pengguna';
        }

        totalSeconds = 7200;
        showToast('Login Berhasil!', false);

        const card = document.getElementById('cardInner');
        if (card) card.classList.add('flipped');
      } else {
        showToast('Username atau kata sandi salah!', true);
        if (pInput) {
          pInput.value = '';
          pInput.focus();
        }
      }
    }

    function logoutSession() {
      const card = document.getElementById('cardInner');
      if (card) card.classList.remove('flipped');
      totalSeconds = 7200;
    }

    function clearSavedCredentials() {
      localStorage.removeItem('albasyir_saved_auth');
      const uInput = document.getElementById('usernameInput');
      const pInput = document.getElementById('passwordInput');
      const rem = document.getElementById('rememberCheck');
      if (uInput) uInput.value = '';
      if (pInput) pInput.value = '';
      if (rem) rem.checked = false;
      showToast('Data login tersimpan berhasil dihapus');
    }

    function checkSavedCredentials() {
      try {
        const saved = localStorage.getItem('albasyir_saved_auth');
        if (saved) {
          const data = JSON.parse(saved);
          const uInput = document.getElementById('usernameInput');
          const pInput = document.getElementById('passwordInput');
          const rem = document.getElementById('rememberCheck');
          if (uInput && data.u) uInput.value = data.u;
          if (pInput && data.p) pInput.value = data.p;
          if (rem) rem.checked = true;
        }
      } catch (err) {}
    }

    window.onload = function() {
      checkSavedCredentials();
      timerInterval = setInterval(updateCountdown, 1000);
    };
  </script>
</body>
</html>
